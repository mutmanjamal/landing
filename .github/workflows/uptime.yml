name: Website availability

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/uptime.yml']

permissions:
  contents: read

concurrency:
  group: website-availability
  cancel-in-progress: false

jobs:
  https-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public pages and protected admin
        shell: bash
        run: |
          set -euo pipefail
          for url in https://mutman.tech/ https://mutman.tech/ar/; do
            curl --fail --silent --show-error --location \
              --retry 2 --retry-delay 5 --retry-max-time 45 \
              --connect-timeout 10 --max-time 20 --output /dev/null "$url"
          done
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --output /dev/null --write-out '%{http_code}' https://mutman.tech/admin/)
          if [ "$status" != 401 ]; then
            printf 'Expected the protected admin to return HTTP 401; received %s\n' "$status"
            exit 1
          fi
          printf 'English and Arabic pages respond over HTTPS; admin authentication is required.\n' >> "$GITHUB_STEP_SUMMARY"
